services:
  benchmark:
    build:
      context: ./benchmark
      dockerfile: Dockerfile
    container_name: docling-benchmark
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
    environment:
      - INPUT_DIR=/data
      - OUTPUT_DIR=/out
      - CONFIG_DIR=/configs
      - WORKERS=1
      - CPU_CORES=2
    volumes:
      - "./data/tech_doc_examples:/data:ro"
      - "./benchmark/out:/out"
      - "./configs:/configs:ro"
      - "./app/core/processing/converter.py:/app/converter.py:ro"
      - "./benchmark/benchmark.py:/app/benchmark.py:ro"
