services:
  redis:
    image: redis/redis-stack:latest
    container_name: docproc-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: docproc-backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PDF_STORE_DIR=/app/pdfs
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs
      - ./app:/app/app
      - pdf-store:/app/pdfs
      - /app/app/frontend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      network: host
    container_name: docproc-worker
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PDF_STORE_DIR=/app/pdfs
    volumes:
      - ./configs:/app/configs
      - ./app:/app/app
      - pdf-store:/app/pdfs
    command: ["arq", "app.worker.WorkerSettings"]

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      network: host
    container_name: docproc-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  redis-data:
  pdf-store:
